services:
  - type: web
    name: genai-banking-chatbot
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false        # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false        # Optional
      - key: GOOGLE_API_KEY
        sync: false        # Optional
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: LOG_FILE
        value: /opt/render/project/src/logs/app.log
    disk:
      name: chroma-storage
      mountPath: /opt/render/project/src/chroma_db
      sizeGB: 1
    healthCheckPath: /api/health
    autoDeploy: true
